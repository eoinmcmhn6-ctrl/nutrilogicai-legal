<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nutri Logic AI — Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A1628;
      color: #c8ddf0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .logo { font-size: 32px; font-weight: 900; color: #EEF6FF; letter-spacing: -0.5px; margin-bottom: 6px; }
    .logo span { color: #A8FF3E; }
    .sub { font-size: 14px; color: #6B8CAE; margin-bottom: 48px; }
    .card {
      background: #0D1E38;
      border: 1px solid #162035;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 { font-size: 18px; font-weight: 700; color: #EEF6FF; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B8CAE; margin-bottom: 28px; line-height: 1.6; }
    .btn {
      display: block;
      background: #A8FF3E;
      color: #0A1628;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 12px;
    }
    .btn.ghost {
      background: transparent;
      color: #6B8CAE;
      border: 1px solid #162035;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="logo">Nutri <span>Logic</span> AI</div>
  <div class="sub">Your personal nutrition coach</div>
  <div class="card">
    <h2>Legal Documents</h2>
    <p>Read our Terms of Service and Privacy Policy below.</p>
    <a href="terms-of-service.html" class="btn">Terms of Service</a>
    <a href="privacy-policy.html" class="btn ghost">Privacy Policy</a>
  </div>
</body>
</html>
